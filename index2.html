<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แผงแอดมิน - ตรวจสอบใบสมัคร</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: linear-gradient(135deg, #1a1a2e, #16213e); min-height: 100vh; color: #fff; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: rgba(255,255,255,0.05); border-radius: 16px; padding: 30px; box-shadow: 0 8px 32px rgba(0,0,0,0.3); }
        h1, h2 { text-align: center; margin-bottom: 30px; color: #ffd700; }
        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from {opacity:0; transform: translateY(10px);} to {opacity:1; transform: translateY(0);} }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 500; }
        input[type="password"] { width: 100%; padding: 12px; border: none; border-radius: 8px; background: rgba(255,255,255,0.1); color: #fff; font-size: 16px; }
        input:focus { outline: 2px solid #ffd700; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; margin: 5px; }
        .btn-sm { padding: 8px 16px; font-size: 14px; }
        .btn-primary { background: #ffd700; color: #000; }
        .btn-primary:hover { background: #ffed4e; transform: translateY(-2px); }
        .btn-back { background: #444; color: #fff; }
        .btn-approve { background: #28a745; color: #fff; }
        .btn-reject { background: #dc3545; color: #fff; }
        .btn-delete { background: #666; color: #fff; }
        .img-grid { display: flex; flex-wrap: wrap; gap: 10px; margin: 10px 0; }
        .preview-img { max-width: 140px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .preview-img:hover { transform: scale(1.05); }
        .login-box { max-width: 420px; margin: 60px auto; text-align: center; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .header-bar a { color: #ffd700; text-decoration: none; font-size: 14px; }
        .filter-bar { margin-bottom: 20px; display: flex; gap: 8px; flex-wrap: wrap; }
        .card { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 22px; margin-bottom: 20px; border-left: 4px solid; }
        .card.pending { border-left-color: #ffc107; }
        .card.approved { border-left-color: #28a745; }
        .card.rejected { border-left-color: #dc3545; }
        .card p { margin: 9px 0; line-height: 1.7; }
        .card strong { color: #ffd700; }
        .status-tag { display: inline-block; padding: 5px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; }
        .status-pending { background: rgba(255,193,7,.15); color: #ffc107; }
        .status-approved { background: rgba(40,167,69,.15); color: #28a745; }
        .status-rejected { background: rgba(220,53,69,.15); color: #dc3545; }
        .empty { text-align: center; padding: 50px 20px; color: #888; font-size: 16px; }
        .img-label { margin-top: 12px; margin-bottom: 4px; font-weight: 500; color: #ccc; }
    </style>
</head>
<body>
<!-- หน้าล็อกอิน -->
<div class="page active" id="loginPage">
    <div class="container login-box">
        <h1>🔐 เข้าสู่ระบบแอดมิน</h1>
        <div class="form-group">
            <label>รหัสผ่านแอดมิน</label>
            <input type="password" id="adminPass" placeholder="กรอกรหัสผ่าน...">
        </div>
        <button class="btn btn-primary" onclick="adminLogin()">เข้าสู่ระบบ</button>
        <br><br>
        <a href="index.html" style="color:#ffd700; font-size:14px;">← กลับไปหน้าสมัคร</a>
    </div>
</div>

<!-- หน้าแผงควบคุม -->
<div class="page" id="panelPage">
    <div class="container">
        <div class="header-bar">
            <h2 style="margin:0;">📋 รายการใบสมัคร</h2>
            <a href="#" onclick="logOut(); return false;">🚪 ออกจากระบบ</a>
        </div>

        <div class="filter-bar">
            <button class="btn btn-sm btn-primary" onclick="setFilter('all')">ทั้งหมด</button>
            <button class="btn btn-sm" style="background:#ffc107; color:#000;" onclick="setFilter('pending')">รอตรวจ</button>
            <button class="btn btn-sm btn-approve" onclick="setFilter('approved')">อนุมัติแล้ว</button>
            <button class="btn btn-sm btn-reject" onclick="setFilter('rejected')">ไม่อนุมัติ</button>
        </div>

        <div id="appList"></div>
    </div>
</div>

<script>
// === ตั้งค่า ===
const ADMIN_PASSWORD = "4210"; // ✅ รหัสผ่านใหม่: 4210
let currentFilter = 'all';

// === ล็อกอิน ===
function adminLogin() {
    const pass = document.getElementById('adminPass').value;
    if (pass === ADMIN_PASSWORD) {
        localStorage.setItem('adminAuth', 'ok');
        showPage('panelPage');
        renderList();
    } else {
        alert('❌ รหัสผ่านไม่ถูกต้อง!');
    }
}

function logOut() {
    localStorage.removeItem('adminAuth');
    document.getElementById('adminPass').value = '';
    showPage('loginPage');
}

function showPage(id) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById(id).classList.add('active');
}

// === ตรวจสอบสิทธิ์อัตโนมัติ ===
window.onload = function () {
    if (localStorage.getItem('adminAuth') === 'ok') {
        showPage('panelPage');
        renderList();
    }
};

// === ตัวกรอง ===
function setFilter(type) {
    currentFilter = type;
    renderList();
}

// === แสดงรายการ ===
function renderList() {
    const container = document.getElementById('appList');
    let apps = JSON.parse(localStorage.getItem('clanApps') || '[]');

    if (currentFilter !== 'all') {
        apps = apps.filter(a => a.status === currentFilter);
    }

    if (apps.length === 0) {
        container.innerHTML = '<div class="empty">📭 ไม่มีรายการสมัคร</div>';
        return;
    }

    container.innerHTML = apps.map(app => `
        <div class="card ${app.status}">
            <p><strong>🆔 เวลาสมัคร:</strong> ${app.time}</p>
            <p><strong>🎮 ชื่อในเกม:</strong> ${escapeHtml(app.gameName)}</p>
            <p><strong>👥 ประวัติแคลน:</strong> ${escapeHtml(app.oldClan)}${app.oldClanDetail !== '-' ? ' — ' + escapeHtml(app.oldClanDetail) : ''}</p>
            <p><strong>💬 เหตุผล:</strong> ${escapeHtml(app.reason)}</p>
            <p><strong>📌 สถานะ:</strong> <span class="status-tag status-${app.status}">${getStatusText(app.status)}</span></p>

            <div class="img-label">รูปตัวละคร:</div>
            <div class="img-grid">${renderImages(app.images.char)}</div>

            <div class="img-label">รูปโทเท็ม:</div>
            <div class="img-grid">${renderImages(app.images.totem)}</div>

            <div class="img-label">รูปสล๊อด:</div>
            <div class="img-grid">${renderImages(app.images.slot)}</div>

            <div style="margin-top:15px;">
                ${app.status === 'pending' ? `
                    <button class="btn btn-sm btn-approve" onclick="changeStatus(${app.id}, 'approved')">✅ อนุมัติ</button>
                    <button class="btn btn-sm btn-reject" onclick="changeStatus(${app.id}, 'rejected')">❌ ไม่อนุมัติ</button>
                ` : ''}
                <button class="btn btn-sm btn-delete" onclick="removeApp(${app.id})">🗑️ ลบ</button>
            </div>
        </div>
    `).join('');
}

function renderImages(arr) {
    arr = arr || [];
    if (arr.length === 0) return '<span style="color:#666;">ไม่มีรูป</span>';
    return arr.map(src => `<img src="${src}" class="preview-img" alt="รูป">`).join('');
}

function getStatusText(s) {
    return { pending: '⏳ รอตรวจสอบ', approved: '✅ อนุมัติแล้ว', rejected: '❌ ไม่อนุมัติ' }[s] || s;
}

function changeStatus(id, newStatus) {
    let apps = JSON.parse(localStorage.getItem('clanApps') || '[]');
    apps = apps.map(a => a.id === id ? { ...a, status: newStatus } : a);
    localStorage.setItem('clanApps', JSON.stringify(apps));
    renderList();
}

function removeApp(id) {
    if (confirm('⚠️ แน่ใจหรือไม่ที่จะลบรายการนี้?')) {
        let apps = JSON.parse(localStorage.getItem('clanApps') || '[]');
        apps = apps.filter(a => a.id !== id);
        localStorage.setItem('clanApps', JSON.stringify(apps));
        renderList();
    }
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}
</script>
</body>
</html>
